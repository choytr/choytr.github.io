title: Truman Choy
tagline: 'Portfolio'
description: 'Frontend-oriented software engineer.'
author: 'Truman Choy'
url: 'https://choytr.github.io'
contact:
  email: choytr@hawaii.edu
  github: https://github.com/choytr
  linkedin: https://linkedin.com/in/choytr
timezone: Pacific/Honolulu
baseurl: ''

# Analytics (Plausible requires sign-up)
analytics:
  plausible:
    enabled: false
    site_fqdn: 'your.site.fqdn'
    script_source: 'https://plausible.io/js/script.js'

# Styling
sass:
  sass_dir: _sass
  style: expanded # compact, expanded or compressed

# Default front matter
defaults:
  -
    scope:
      path: ''
    values:
      layout: 'default'

# Paginate
pagination:
  enabled: true
  # Value set low for demonstration purposes
  per_page: 3
  sort_field: 'date'
  sort_reverse: true

# Category Paginating
autopages:
  enabled: true
  categories:
    title: 'Posts in category :cat'
    permalink: '/category/:cat'
    silent: false

# DON'T CHANGE THE FOLLOWING (unless you know what you're doing)
markdown: kramdown
kramdown:
  hard_wrap: false
  input: GFM
  syntax_highlighter: rouge
strict_front_matter: true
mathjax: true
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - COPYING
  - README.md
include:
  - .nojekyll
  - _data
plugins:
  - jekyll-gist
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag
